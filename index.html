<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер Тренировок</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #12161f;
    color: #e6e9ef;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 22px;
    text-align: center;
    margin: 0 0 18px;
    font-weight: 600;
  }

  /* Переключатель Месяц / Год */
  .tabs {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 16px;
    background: #1c2230;
    padding: 4px;
    border-radius: 12px;
  }
  .tab {
    flex: 1;
    background: transparent;
    border: none;
    color: #8b94a7;
    padding: 9px 0;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active {
    background: #232a38;
    color: #e6e9ef;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month {
    font-size: 18px;
    font-weight: 600;
    text-transform: capitalize;
  }
  .yearLabel {
    font-size: 26px;
    font-weight: 700;
  }
  .nav button {
    background: #232a38;
    border: none;
    color: #e6e9ef;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
  }
  .nav button:active { background: #2e3748; }

  .weekdays, .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .weekdays div {
    text-align: center;
    font-size: 12px;
    color: #8b94a7;
    padding: 4px 0;
  }
  .day {
    aspect-ratio: 1;
    border-radius: 10px;
    background: #1c2230;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    transition: transform .08s;
    border: 2px solid transparent;
  }
  .day:active { transform: scale(0.92); }
  .day.empty { background: transparent; cursor: default; }
  .day.today { border-color: #4a5568; }
  .day.done { background: #22c55e; color: #06210f; font-weight: 700; }
  .day.missed { background: #ef4444; color: #2a0606; font-weight: 700; }

  /* ===== Годовой вид ===== */
  .yearStats {
    text-align: right;
    font-size: 15px;
    color: #8b94a7;
    margin: -6px 0 12px;
  }
  .yearStats b { color: #e6e9ef; font-size: 17px; }

  .yearGrid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 3px;
  }
  .monthCol { display: flex; flex-direction: column; gap: 3px; }
  .monthCol .mlabel {
    text-align: center;
    font-size: 9px;
    color: #8b94a7;
    margin-bottom: 3px;
    white-space: nowrap;
  }
  .ycell {
    height: 9px;
    width: 100%;
    border-radius: 2px;
    background: #1c2230;
    cursor: pointer;
  }
  .ycell.done { background: #22c55e; }
  .ycell.missed { background: #ef4444; }
  .ycell.today { outline: 1px solid #8b94a7; }
  .ycell.future { opacity: .35; }

  .legend {
    display: flex;
    gap: 18px;
    justify-content: center;
    margin-top: 20px;
    font-size: 13px;
    color: #b6becd;
    flex-wrap: wrap;
  }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    display: inline-block;
  }
  .dot.green { background: #22c55e; }
  .dot.red { background: #ef4444; }
  .dot.gray { background: #1c2230; border: 2px solid #4a5568; }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #6b7488;
    margin-top: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🏋️ Трекер Тренировок</h1>

  <div class="tabs">
    <button class="tab active" id="tabMonth">Месяц</button>
    <button class="tab" id="tabYear">Год</button>
  </div>

  <!-- ===== Вид месяца ===== -->
  <div id="monthView">
    <div class="header">
      <div class="month" id="monthLabel"></div>
      <div class="nav">
        <button id="prev">&#8249;</button>
        <button id="next">&#8250;</button>
      </div>
    </div>

    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <!-- ===== Годовой вид ===== -->
  <div id="yearView" style="display:none">
    <div class="header">
      <div class="yearLabel" id="yearLabel"></div>
      <div class="nav">
        <button id="prevYear">&#8249;</button>
        <button id="nextYear">&#8250;</button>
      </div>
    </div>

    <div class="yearStats" id="yearStats"></div>
    <div class="yearGrid" id="yearGrid"></div>
  </div>

  <div class="legend">
    <span><i class="dot green"></i> Делал</span>
    <span><i class="dot red"></i> Не делал</span>
    <span><i class="dot gray"></i> Не отмечено</span>
  </div>

  <div class="hint" id="hint">Клик по дню: 1-й клик — зелёный, 2-й — красный,<br>3-й — сброс отметки.</div>
</div>

<script>
  const KEY = "workoutTracker.v1";
  // храним: { "2025-01-15": "done" | "missed" }
  let data = JSON.parse(localStorage.getItem(KEY) || "{}");

  let mode = "month";          // "month" | "year"
  let view = new Date();
  view.setDate(1);
  let yearShown = new Date().getFullYear();

  const grid = document.getElementById("grid");
  const monthLabel = document.getElementById("monthLabel");
  const yearGrid = document.getElementById("yearGrid");
  const yearLabel = document.getElementById("yearLabel");
  const yearStats = document.getElementById("yearStats");

  const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь",
                  "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  const MONTHS_SHORT = ["Янв","Фев","Мар","Апр","Май","Июн",
                        "Июл","Авг","Сен","Окт","Ноя","Дек"];

  function iso(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function todayISO() { return iso(new Date()); }

  /* ---------- Месячный вид ---------- */
  function renderMonth() {
    monthLabel.textContent = MONTHS[view.getMonth()] + " " + view.getFullYear();
    grid.innerHTML = "";

    const year = view.getFullYear();
    const month = view.getMonth();

    const firstDay = new Date(year, month, 1);
    let offset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < offset; i++) {
      const e = document.createElement("div");
      e.className = "day empty";
      grid.appendChild(e);
    }

    const tISO = todayISO();

    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, month, d);
      const key = iso(date);
      const el = document.createElement("div");
      el.className = "day";
      el.textContent = d;

      if (key === tISO) el.classList.add("today");
      if (data[key] === "done") el.classList.add("done");
      if (data[key] === "missed") el.classList.add("missed");

      el.addEventListener("click", () => {
        const cur = data[key];
        if (!cur) data[key] = "done";
        else if (cur === "done") data[key] = "missed";
        else delete data[key];

        localStorage.setItem(KEY, JSON.stringify(data));
        render();
      });

      grid.appendChild(el);
    }
  }

  /* ---------- Годовой вид ---------- */
  function renderYear() {
    yearLabel.textContent = yearShown;
    yearGrid.innerHTML = "";

    const tISO = todayISO();
    const tYear = new Date().getFullYear();

    let totalDone = 0;
    for (const k in data) {
      if (data[k] === "done" && k.startsWith(yearShown + "-")) totalDone++;
    }
    yearStats.innerHTML = "<b>" + totalDone + "</b> тренировок за год";

    for (let m = 0; m < 12; m++) {
      const col = document.createElement("div");
      col.className = "monthCol";

      const label = document.createElement("div");
      label.className = "mlabel";
      label.textContent = MONTHS_SHORT[m];
      col.appendChild(label);

      const daysInMonth = new Date(yearShown, m + 1, 0).getDate();

      for (let d = 1; d <= 31; d++) {
        const cell = document.createElement("div");
        cell.className = "ycell";

        if (d <= daysInMonth) {
          const key = iso(new Date(yearShown, m, d));
          if (data[key] === "done") cell.classList.add("done");
          if (data[key] === "missed") cell.classList.add("missed");
          if (key === tISO) cell.classList.add("today");
          if (key > tISO && yearShown === tYear) cell.classList.add("future");

          cell.addEventListener("click", () => {
            const cur = data[key];
            if (!cur) data[key] = "done";
            else if (cur === "done") data[key] = "missed";
            else delete data[key];

            localStorage.setItem(KEY, JSON.stringify(data));
            render();
          });
        } else {
          cell.style.visibility = "hidden"; // пустые дни коротких месяцев
        }

        col.appendChild(cell);
      }

      yearGrid.appendChild(col);
    }
  }

  /* ---------- Управление ---------- */
  function render() {
    if (mode === "month") renderMonth();
    else renderYear();
  }

  function setMode(m) {
    mode = m;
    document.getElementById("tabMonth").classList.toggle("active", m === "month");
    document.getElementById("tabYear").classList.toggle("active", m === "year");
    document.getElementById("monthView").style.display = m === "month" ? "" : "none";
    document.getElementById("yearView").style.display = m === "year" ? "" : "none";
    document.getElementById("hint").innerHTML = m === "month"
      ? "Клик по дню: 1-й клик — зелёный, 2-й — красный,<br>3-й — сброс отметки."
      : "Клик по квадратику тоже отмечает день:<br>зелёный → красный → сброс.";
    render();
  }

  document.getElementById("tabMonth").addEventListener("click", () => setMode("month"));
  document.getElementById("tabYear").addEventListener("click", () => setMode("year"));

  document.getElementById("prev").addEventListener("click", () => {
    view.setMonth(view.getMonth() - 1);
    renderMonth();
  });
  document.getElementById("next").addEventListener("click", () => {
    view.setMonth(view.getMonth() + 1);
    renderMonth();
  });
  document.getElementById("prevYear").addEventListener("click", () => {
    yearShown--;
    renderYear();
  });
  document.getElementById("nextYear").addEventListener("click", () => {
    yearShown++;
    renderYear();
  });

  render();
</script>
</body>
</html>
